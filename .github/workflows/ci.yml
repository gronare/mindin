name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --all-groups --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras --no-dev --no-install-project
      # Exceptions: certifi is MPL-2.0 and ships its CA bundle unmodified; py_rust_stemmers has no licence metadata, its LICENSE file is MIT.
      - name: Every runtime dependency has a permissive licence
        run: >-
          uvx pip-licenses@5.5.5 --python .venv/bin/python --from=mixed --partial-match
          --fail-on="GPL"
          --allow-only="MIT;BSD;Apache;ISC;PSF;Python Software Foundation;Zlib;Unlicense;CC0"
          --ignore-packages certifi py_rust_stemmers

  docs-site:
    needs: [test, audit, licenses]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rebuild mindin.dev, whose /docs are built from this repo's docs, when this push changed them
        env:
          GH_TOKEN: ${{ secrets.MINDIN_SITE_DISPATCH_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && [ -z "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- docs README.md)" ]; then
            echo "This push leaves docs/ and README.md as they were"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::MINDIN_SITE_DISPATCH_TOKEN is not set, so mindin.dev shows main's docs from its next deploy"
            exit 0
          fi
          gh workflow run deploy.yml --repo gronare/mindin-site --ref main || echo "::warning::mindin.dev's deploy did not start; run it from gronare/mindin-site's Actions tab"
