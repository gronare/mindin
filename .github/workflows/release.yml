name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          server=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' mindin/server.py)
          if [ "$package" != "$tag" ] || [ "$server" != "$tag" ]; then echo "::error::pyproject.toml says $package, server.py says $server, the tag says $tag"; exit 1; fi
          former=$(sed -n 's/^version = "\(.*\)"/\1/p' shim/pyproject.toml | head -1)
          pinned=$(grep -c "\"mindin\(\[semantic\]\)\?==$tag\"" shim/pyproject.toml || true)
          if [ "$former" != "$tag" ] || [ "$pinned" != 2 ]; then echo "::error::shim/pyproject.toml says $former and pins mindin==$tag $pinned times, the tag says $tag"; exit 1; fi
      - name: CHANGES.md says what the version brings
        run: sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  pypi:
    needs: [test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build --out-dir dist
      - name: Build the former name, which installs mindin of the same version
        run: uv build shim --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr-build:
    needs: [test]
    strategy:
      fail-fast: true
      matrix:
        platform: [linux/amd64, linux/arm64]
        variant: ["", "-semantic"]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: ""
            extras: ""
          - variant: "-semantic"
            extras: --extra semantic
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: EXTRAS=${{ matrix.extras }}
          labels: io.modelcontextprotocol.server.name=io.github.gronare/mindin
          outputs: type=image,"name=ghcr.io/gronare/mindin,ghcr.io/gronare/notes-vault-mcp",push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest${{ matrix.variant }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  ghcr:
    needs: [ghcr-build]
    strategy:
      matrix:
        variant: ["", "-semantic"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest${{ matrix.variant }}-ubuntu-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag one manifest for amd64 and arm64 under both names
        working-directory: ${{ runner.temp }}/digests
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -- *
          [ "$#" -eq 2 ] || { echo "::error::expected two digests, found: $*"; exit 1; }
          for image in ghcr.io/gronare/mindin ghcr.io/gronare/notes-vault-mcp; do
            sources=""
            for digest in "$@"; do sources="$sources $image@sha256:$digest"; done
            # shellcheck disable=SC2086
            docker buildx imagetools create -t "$image:$GITHUB_REF_NAME$VARIANT" -t "$image:latest$VARIANT" $sources
            docker buildx imagetools inspect "$image:$GITHUB_REF_NAME$VARIANT"
          done

  registry:
    needs: [pypi, ghcr]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Match server.json to the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Install mcp-publisher
        run: |
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher

      - name: Log in to the MCP registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "publish failed, PyPI may not have the release yet; retrying in 30s"
            sleep 30
          done
          exit 1

  release:
    needs: [pypi, ghcr, registry]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            CHANGES.md
            scripts/release-notes.sh
            deploy/docker/compose.yml
            deploy/docker/Caddyfile
            deploy/docker/.env.example
            scripts/install.sh
            scripts/server.sh
          sparse-checkout-cone-mode: false
      - name: The release notes, from the version's section of CHANGES.md
        run: sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Publish the GitHub release with the version's notes, as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="mindin ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --title "$title" --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md --title "$title" --latest
          fi
      - name: Attach the install scripts and the Docker Compose files, which the install docs fetch from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp deploy/docker/.env.example example.env
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber scripts/install.sh scripts/server.sh deploy/docker/compose.yml deploy/docker/Caddyfile example.env

  sbom:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras --no-dev
      - name: CycloneDX SBOM of the Python package and its locked dependencies
        run: uvx --from cyclonedx-bom@8.0.1 cyclonedx-py environment --pyproject pyproject.toml --of JSON -o "mindin-$GITHUB_REF_NAME.cdx.json" .venv/bin/python
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/gronare/mindin:${{ github.ref_name }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: mindin-image-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/gronare/mindin:${{ github.ref_name }}-semantic
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: mindin-image-${{ github.ref_name }}-semantic.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach the SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*.cdx.json
