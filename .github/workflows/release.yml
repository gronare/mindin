name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          server=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' notes_vault_mcp/server.py)
          if [ "$package" != "$tag" ] || [ "$server" != "$tag" ]; then echo "::error::pyproject.toml says $package, server.py says $server, the tag says $tag"; exit 1; fi
      - name: CHANGES.md says what the version brings
        run: sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  pypi:
    needs: [test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gronare/notes-vault-mcp:${{ github.ref_name }}
            ghcr.io/gronare/notes-vault-mcp:latest
          labels: io.modelcontextprotocol.server.name=io.github.gronare/notes-vault-mcp
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: EXTRAS=--extra semantic
          tags: |
            ghcr.io/gronare/notes-vault-mcp:${{ github.ref_name }}-semantic
            ghcr.io/gronare/notes-vault-mcp:latest-semantic
          labels: io.modelcontextprotocol.server.name=io.github.gronare/notes-vault-mcp

  registry:
    needs: [pypi, ghcr]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Match server.json to the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Install mcp-publisher
        run: |
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher

      - name: Log in to the MCP registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "publish failed, PyPI may not have the release yet; retrying in 30s"
            sleep 30
          done
          exit 1

  plugin:
    needs: [pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: gronare/claude-plugins
          ref: main
          ssh-key: ${{ secrets.CLAUDE_PLUGINS_DEPLOY_KEY }}

      - name: Point the vault plugin at this release
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if grep -q "notes-vault-mcp==${VERSION}\"" plugins/vault/.mcp.json; then
            echo "the plugin already pins ${VERSION}"
            exit 0
          fi
          sed -i -E "s/notes-vault-mcp==[0-9.]+/notes-vault-mcp==${VERSION}/g" plugins/vault/.mcp.json plugins/vault/hooks/hooks.json
          PLUGIN="$(jq -r '.version' plugins/vault/.claude-plugin/plugin.json | awk -F. '{print $1"."$2"."$3+1}')"
          jq --arg v "$PLUGIN" '.version = $v' plugins/vault/.claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp plugins/vault/.claude-plugin/plugin.json
          git config user.name "notes-vault-mcp release"
          git config user.email "release@notes-vault-mcp.invalid"
          git add plugins/vault/.mcp.json plugins/vault/hooks/hooks.json plugins/vault/.claude-plugin/plugin.json
          git commit -m "vault ${PLUGIN}: the server and the hooks pin notes-vault-mcp==${VERSION}"
          git push origin HEAD:main

  release:
    needs: [pypi, ghcr, registry, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            CHANGES.md
            scripts/release-notes.sh
          sparse-checkout-cone-mode: false
      - name: The release notes, from the version's section of CHANGES.md
        run: sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Publish the GitHub release with the version's notes, as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="notes-vault-mcp ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --title "$title" --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md --title "$title" --latest
          fi
