services:
  vault:
    image: ghcr.io/gronare/mindin:v0.15.0
    command: serve --transport http --host 0.0.0.0 --port 8765
    restart: unless-stopped
    env_file: .env
    environment:
      VAULT_PUBLIC_URL: https://${VAULT_HOST:?set VAULT_HOST in .env}
      VAULT_FORWARDED_ALLOW_IPS: ${VAULT_FORWARDED_ALLOW_IPS:-*}
    volumes:
      - vault-data:/data
    expose:
      - "8765"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      VAULT_HOST: ${VAULT_HOST:?set VAULT_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - vault

volumes:
  vault-data:
  caddy-data:
  caddy-config:
