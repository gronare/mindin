apiVersion: v1
kind: Secret
metadata:
  name: notes-vault-mcp
  labels:
    app: notes-vault-mcp
type: Opaque
stringData:
  VAULT_PUBLIC_URL: https://vault.example.com
  VAULT_HOSTED_MASTER_KEY: REPLACE_ME
  S3_ENDPOINT: https://s3.example.com
  S3_BUCKET: vault
  S3_ACCESS_KEY: REPLACE_ME
  S3_SECRET_KEY: REPLACE_ME
  # Each sign-in method is on when its settings are present; set at least one.
  VAULT_SMTP_HOST: smtp.example.com
  VAULT_SMTP_USERNAME: REPLACE_ME
  VAULT_SMTP_PASSWORD: REPLACE_ME
  VAULT_SMTP_FROM: Vault <vault@example.com>
