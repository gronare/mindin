[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindin"
version = "0.14.0"
description = "MCP server for a markdown notes vault on S3 or a local directory, with a SQLite index, schema-aware writes and session hooks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Carl Green", email = "carl.green@gronare.se" }]
keywords = ["mcp", "obsidian", "notes", "vault", "s3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "mcp>=2.2",
    "boto3>=1.34.0",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.15",
    "httpx2>=2.5",
    "snowballstemmer>=3.1.1",
    "webauthn>=3.0.1",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
semantic = [
    "fastembed>=0.7",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://mindin.dev"
Repository = "https://github.com/gronare/mindin"

[project.scripts]
mindin = "mindin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto>=5.0",
    "ruff>=0.6",
    "numpy>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["mindin"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
